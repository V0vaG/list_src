<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}List App{% endblock %}</title>
    
    <style>
        /* General styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Button styling */
        .button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            width: 100%;
            margin-top: 10px;
            display: block;
            text-align: center;
        }

        .button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .button:active {
            background-color: #3e8e41;
            transform: translateY(0);
        }

        /* Popup notification styles */
        .popup {
            position: fixed;
            bottom: -100px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.5s ease-in-out;
            z-index: 1000;
        }

        .popup.show {
            bottom: 20px;
            opacity: 1;
        }

        .popup.error {
            background-color: #f44336;
        }

        .close-btn {
            background-color: transparent;
            color: white;
            border: none;
            font-size: 16px;
            margin-left: 15px;
            cursor: pointer;
        }

        /* Version footer */
        .version-footer {
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 10px 20px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .version-footer a {
            color: #6c757d;
            text-decoration: none;
        }

        .version-footer a:hover {
            color: #495057;
            text-decoration: underline;
        }

        /* Allow templates to override container styles */
        {% block extra_styles %}{% endblock %}
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Version Footer -->
    <div class="version-footer">
        <span>Version {{ app_version or '1.0.0' }}</span>
        <span style="margin: 0 10px;">|</span>
        <span>List Management System</span>
    </div>

    <!-- Popup notification -->
    <div id="notificationPopup" class="popup">
        <span id="popupMessage"></span>
        <button class="close-btn" onclick="closePopup()">✖</button>
    </div>

    <script>
        function showPopup(message, isError = false) {
            const popup = document.getElementById('notificationPopup');
            const popupMessage = document.getElementById('popupMessage');
            popupMessage.innerText = message;

            if (isError) {
                popup.classList.add('error');
            } else {
                popup.classList.remove('error');
            }

            popup.classList.add('show');

            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        function closePopup() {
            document.getElementById('notificationPopup').classList.remove('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  showPopup("{{ message }}", "{{ category }}" === "danger");
                {% endfor %}
              {% endif %}
            {% endwith %}
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
